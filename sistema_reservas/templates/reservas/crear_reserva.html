{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="container mt-4">
        <h1>Crear Reserva</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{% url 'reservas:lista_reservas' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
{% endblock %}
