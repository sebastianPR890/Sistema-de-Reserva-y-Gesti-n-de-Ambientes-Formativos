{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="container mt-4">
        <h1>Eliminar Reserva</h1>
        <div class="alert alert-danger">
            <p>¿Estás seguro de que quieres eliminar esta reserva?</p>
            <p><strong>Detalles de la reserva:</strong> {{ reserva }}</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Confirmar Eliminación</button>
            <a href="{% url 'reservas:lista_reservas' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
{% endblock %}
